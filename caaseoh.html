<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Heavyweight In A Rug</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: monospace;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .timer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      padding: 15px 20px;
      border: 4px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 10;
    }

    @media screen and (min-width: 600px) {
      .timer {
        width: 480px;
      }
    }

    .timer span {
      font-weight: bold;
      color: #d63384;
    }
  </style>
</head>

    function onMouseMove(e) {
      mouseOffset.x = (e.clientX - window.innerWidth / 2) / window.innerWidth / 2 * movementRange;
      mouseOffset.y = (e.clientY - window.innerHeight / 2) / window.innerHeight / 2 * movementRange;
    }

    function lerp(start, end, amount) {
      return start * (1 - amount) + end * amount;
    }

    function loopDraw() {
      movementOffset.x = lerp(movementOffset.x, mouseOffset.x, 0.05);
      movementOffset.y = lerp(movementOffset.y, mouseOffset.y, 0.05);

      for (let i = loopingPugs; i >= 1; i--) {
        draw(i * offsetDistance + currentOffset, i);
      }

      draw(offsetDistance, 1);

      currentOffset++;
      if (currentOffset >= offsetDistance) {
        currentOffset = 0;
      }

      const newTime = Math.floor((Date.now() - startTime) / 1000);

      secondsCount.innerText = newTime;

      if (levels[newTime]) {
        level.innerText = levels[newTime];
      }

      requestAnimationFrame(loopDraw);
    }

    function startLooping() {
      requestAnimationFrame(loopDraw);
    }
  </script>
</body>
</html>
